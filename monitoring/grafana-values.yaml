persistence:
  enabled: false

adminPassword: admin

# Wire Prometheus as the default datasource so panels work on first load.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true

# Tell Grafana where to look for provisioned dashboard JSON files.
# The helm chart mounts each entry under dashboards.default as a ConfigMap
# at the path below — no sidecar or separate K8s object needed.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Inline dashboard JSON.  The helm chart creates a ConfigMap from this and
# mounts it at the provider path above.
dashboards:
  default:
    cusum-tuning:
      json: |
        {
          "title": "CUSUM Layer 1 Tuning",
          "uid": "cusum-l1-tuning",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "15s",
          "time": { "from": "now-30m", "to": "now" },
          "timezone": "browser",
          "graphTooltip": 1,
          "tags": ["ebpf", "cusum", "layer1"],
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Node-wide pod ingress — bytes/sec",
              "description": "Node-wide pod ingress bytes/sec scoped to namespace=default (HotelReservation workload). interface=eth0 is the in-pod name — identical for every pod, so no per-pod config is needed. Prometheus service discovery handles churn: new pods appear automatically, deleted pods go stale. namespace=default excludes host-network pods (cilium-agent, apiserver, etcd…) that share the node netns and would otherwise cause double-counting against the eBPF node_ingress_bytes measurement.",
              "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 },
              "datasource": { "type": "prometheus" },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (instance) (rate(container_network_receive_bytes_total{namespace=\"default\", pod!=\"\", interface=\"eth0\"}[1m]))",
                  "legendFormat": "{{instance}}"
                }
              ],
              "fieldConfig": {
                "defaults": { "unit": "Bps" },
                "overrides": []
              },
              "options": {
                "tooltip": { "mode": "multi", "sort": "none" }
              }
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Node-wide pod ingress — packets/sec",
              "description": "Directional context only — GRO coalescing means skb count != wire packet count, so this is not a precise per-wire-packet oracle. Same namespace=default + pod!='' + interface=eth0 scope as the bytes panel.",
              "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
              "datasource": { "type": "prometheus" },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (instance) (rate(container_network_receive_packets_total{namespace=\"default\", pod!=\"\", interface=\"eth0\"}[1m]))",
                  "legendFormat": "{{instance}}"
                }
              ],
              "fieldConfig": {
                "defaults": { "unit": "pps" },
                "overrides": []
              },
              "options": {
                "tooltip": { "mode": "multi", "sort": "none" }
              }
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Cilium drop bytes/sec",
              "description": "INGRESS series (solid): the real guardrail. Any sustained non-zero value during a wrk2 run means the TC byte counter under-counts real ingress and CUSUM baselines will be wrong. EGRESS series (dashed, grey): informational only — expected IPv6 NDP/MLD bring-up chatter on this IPv4-only Cilium cluster; does NOT affect the ingress measurement and can be ignored.",
              "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
              "datasource": { "type": "prometheus" },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum by (reason) (rate(cilium_drop_bytes_total{direction=\"INGRESS\"}[1m]))",
                  "legendFormat": "INGRESS / {{reason}}"
                },
                {
                  "refId": "B",
                  "expr": "sum by (reason) (rate(cilium_drop_bytes_total{direction=\"EGRESS\"}[1m]))",
                  "legendFormat": "EGRESS / {{reason}}"
                }
              ],
              "fieldConfig": {
                "defaults": { "unit": "Bps" },
                "overrides": [
                  {
                    "matcher": { "id": "byRegexp", "options": "^EGRESS /" },
                    "properties": [
                      { "id": "color", "value": { "mode": "fixed", "fixedColor": "gray" } },
                      { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [8, 4] } },
                      { "id": "custom.lineWidth", "value": 1 }
                    ]
                  }
                ]
              },
              "options": {
                "tooltip": { "mode": "multi", "sort": "none" }
              }
            }
          ]
        }
