# Detector window + k6 settings for the 10 ms window (sourced by experiments/run.sh).
WINDOW=5ms
BASELINE_RATE=2500
BURSTY_WINDOW_RPS=2500     # extra rate: peak = BASELINE_RATE + BURSTY_WINDOW_RPS
BURSTY_WINDOW_SIZE_MS=500
N_BURSTS=5
GAP_S=1
SETTLE_S=4                  # flat baseline before the first burst: We aim to offer enough start_up time for a stable baseline to all configurations (for 100ms windows, 3s is the minimum for having 30 window samples). Added some headroom because 0.5s is from our experiments what takes from k6 first request to detector being armed (starts executing periodically after accesing node, bpf load verificaiotn, attach and bpf timer arming).
TARGET=http://172.18.0.2:30500
PRE_ALLOC_VUS=400
MAX_VUS=500
